name: CI

on:
  push:
    branches:
      - main
      - Development

  pull_request:
    branches:
      - main

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install -r bibliotecas.txt

      - name: Verificar codigo Python
        run: python -m py_compile app.py