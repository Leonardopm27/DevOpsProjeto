name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install -r bibliotecas.txt

      - name: Verificar codigo Python
        run: python -m py_compile app.py

      - name: Executar testes unitarios
        run: python -m unittest teste.py

      - name: Enviar alerta para Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\":\"GitHub Actions: existe mais uma entrada de Pull Request na branch main. Status: ${{ job.status }}\"}" \
          "$DISCORD_WEBHOOK"